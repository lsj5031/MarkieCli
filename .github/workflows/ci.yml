name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs of the same branch/PR to avoid wasting runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the toolchain so a fresh stable release can't silently break the
  # `-D warnings` clippy gate (new clippy lints ship with every Rust release).
  # Bump this deliberately and fix any fallout in the same change.
  RUST_VERSION: "1.97.1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  lint:
    name: Format + Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  smoke-test:
    name: Smoke visuals in sync
    runs-on: ubuntu-latest
    needs: [test, lint]
    timeout-minutes: 30
    # Same pinned font environment as demo-sync so the committed smoke
    # baselines resolve the same generic families and text metrics.
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies and Rust
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git build-essential pkg-config \
            libfontconfig1-dev fonts-dejavu-core python3
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check smoke visuals match baselines
        run: bash scripts/check-smoke.sh /tmp/ci-smoke
      # Add CJK coverage only after the historical DejaVu baseline check.
      - name: Install evidence fonts and PDF preview tools
        if: ${{ !cancelled() }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig fonts-noto-cjk poppler-utils
      - name: Render quality corpus and check semantic content
        if: ${{ !cancelled() }}
        run: bash scripts/smoke-test.sh /tmp/ci-quality
      - name: Upload full geometry and format evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-quality-${{ github.sha }}
          path: |
            /tmp/ci-smoke
            /tmp/ci-quality
          retention-days: 14
          if-no-files-found: warn

  demo-sync:
    name: Demo assets in sync
    runs-on: ubuntu-latest
    needs: [test, lint]
    timeout-minutes: 30
    # Run in a pinned font environment: the runner image ships many fonts, and
    # generic families (sans-serif/monospace/serif) resolve differently per
    # platform, which shifts text metrics. DejaVu-only matches the baseline the
    # committed demos are checked against (see scripts/check-demos.sh).
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies and Rust
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git build-essential pkg-config \
            libfontconfig1-dev fonts-dejavu-core python3
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Regenerate demos
        run: bash scripts/make-demo.sh /tmp/ci-demos
      - name: Check committed demos match the renderer
        run: bash scripts/check-demos.sh /tmp/ci-demos
      - name: Upload regenerated demos for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-evidence-${{ github.sha }}
          path: /tmp/ci-demos
          retention-days: 14
          if-no-files-found: warn
