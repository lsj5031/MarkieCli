<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markie — Demo Gallery</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --bg-dark: #16181d;
    --card: #ffffff;
    --card-dark: #1f2229;
    --border: #e2e5ea;
    --border-dark: #2d313a;
    --text: #1c1f26;
    --text-dark: #e4e7ee;
    --muted: #6a7280;
    --muted-dark: #9aa3b2;
    --accent: #268bd2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  @media (prefers-color-scheme: dark) {
    body { background: var(--bg-dark); color: var(--text-dark); }
    .card { background: var(--card-dark); border-color: var(--border-dark); }
    .chip { border-color: var(--border-dark); color: var(--text-dark); }
    .chip.active { border-color: var(--accent); color: var(--accent); }
    .lb-caption { background: #0c0e12; color: var(--text-dark); border-color: var(--border-dark); }
    .muted { color: var(--muted-dark); }
  }
  header {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 8px;
  }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .sub a { color: var(--accent); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; max-width: 1080px; margin: 0 auto; padding: 0 20px 18px; }
  .chip {
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  .chip.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .grid {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: zoom-in;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.12); }
  .card .thumb-wrap { height: 260px; background: #101318; position: relative; }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
  }
  .card .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(10, 12, 16, .78);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
    border-radius: 4px;
    padding: 3px 7px;
  }
  .card figcaption { padding: 12px 14px; }
  .card .name { font-size: 14px; font-weight: 600; word-break: break-all; }
  .card .meta { margin-top: 3px; font-size: 12px; color: var(--muted); }
  .card.pdf .thumb-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #b91c1c, #7f1d1d);
  }
  .card.pdf .thumb-wrap .pdf-mark { color: #fff; font-size: 15px; font-weight: 600; }
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(8, 9, 12, .92);
    display: flex;
    flex-direction: column;
    z-index: 100;
    padding: 20px;
  }
  .lightbox[hidden] { display: none; }
  .lb-top { display: flex; align-items: center; gap: 10px; margin: 0 auto 10px; max-width: 1200px; width: 100%; }
  .lb-caption {
    flex: 1;
    font-size: 14px;
    color: #e4e7ee;
    background: #0c0e12;
    border: 1px solid var(--border-dark);
    border-radius: 6px;
    padding: 8px 12px;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lb-btn {
    border: none;
    background: #1f2229;
    color: #e4e7ee;
    font-size: 18px;
    line-height: 1;
    width: 38px;
    height: 38px;
    border-radius: 6px;
    cursor: pointer;
  }
  .lb-btn:hover { background: #2d313a; }
  .lb-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    position: relative;
    min-height: 0;
  }
  .lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
  .lb-stage iframe { width: 100%; height: 100%; border: none; border-radius: 4px; background: #fff; }
  .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: rgba(31, 34, 41, .85);
    color: #e4e7ee;
    font-size: 22px;
    cursor: pointer;
  }
  .lb-nav:hover { background: rgba(45, 49, 58, .95); }
  .lb-prev { left: 14px; }
  .lb-next { right: 14px; }
  .lb-hint { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 0 0; }
</style>
</head>
<body>

<header>
  <h1>Markie — Demo Gallery</h1>
  <p class="sub">
    Every committed demo asset rendered from
    <a href="../demo-all-features.md">demo-all-features.md</a>.
    Click any card to open it full-size; use <kbd>←</kbd>/<kbd>→</kbd> to navigate and <kbd>Esc</kbd> to close.
    Regenerated by <a href="../scripts/make-demo.sh">make-demo.sh</a>.
  </p>
</header>

<div class="filters" id="filters">
  <button class="chip active" data-filter="all">All (11)</button>
  <button class="chip" data-filter="svg">SVG (5)</button>
  <button class="chip" data-filter="png">PNG (5)</button>
  <button class="chip" data-filter="pdf">PDF (1)</button>
</div>

<main class="grid" id="grid">
  <figure class="card" data-format="svg" data-src="../demo-all-features.svg">
    <div class="thumb-wrap"><img src="../demo-all-features.svg" alt="demo-all-features.svg" loading="lazy"><span class="badge">SVG</span></div>
    <figcaption><div class="name">demo-all-features.svg</div><div class="meta">Solarized Light (default)</div></figcaption>
  </figure>
  <figure class="card" data-format="png" data-src="../demo-all-features.png">
    <div class="thumb-wrap"><img src="../demo-all-features.png" alt="demo-all-features.png" loading="lazy"><span class="badge">PNG · 2×</span></div>
    <figcaption><div class="name">demo-all-features.png</div><div class="meta">Solarized Light (default) — 2× retina</div></figcaption>
  </figure>
  <figure class="card pdf" data-format="pdf" data-src="../demo-all-features.pdf">
    <div class="thumb-wrap"><span class="pdf-mark">demo-all-features.pdf — Solarized Light (default)</span><span class="badge">PDF</span></div>
    <figcaption><div class="name">demo-all-features.pdf</div><div class="meta">Solarized Light (default)</div></figcaption>
  </figure>
  <figure class="card" data-format="svg" data-src="../demo-dracula.svg">
    <div class="thumb-wrap"><img src="../demo-dracula.svg" alt="demo-dracula.svg" loading="lazy"><span class="badge">SVG</span></div>
    <figcaption><div class="name">demo-dracula.svg</div><div class="meta">Dracula</div></figcaption>
  </figure>
  <figure class="card" data-format="png" data-src="../demo-dracula.png">
    <div class="thumb-wrap"><img src="../demo-dracula.png" alt="demo-dracula.png" loading="lazy"><span class="badge">PNG · 2×</span></div>
    <figcaption><div class="name">demo-dracula.png</div><div class="meta">Dracula — 2× retina</div></figcaption>
  </figure>
  <figure class="card" data-format="svg" data-src="../demo-nord.svg">
    <div class="thumb-wrap"><img src="../demo-nord.svg" alt="demo-nord.svg" loading="lazy"><span class="badge">SVG</span></div>
    <figcaption><div class="name">demo-nord.svg</div><div class="meta">Nord</div></figcaption>
  </figure>
  <figure class="card" data-format="png" data-src="../demo-nord.png">
    <div class="thumb-wrap"><img src="../demo-nord.png" alt="demo-nord.png" loading="lazy"><span class="badge">PNG · 2×</span></div>
    <figcaption><div class="name">demo-nord.png</div><div class="meta">Nord — 2× retina</div></figcaption>
  </figure>
  <figure class="card" data-format="svg" data-src="../demo-catppuccin.svg">
    <div class="thumb-wrap"><img src="../demo-catppuccin.svg" alt="demo-catppuccin.svg" loading="lazy"><span class="badge">SVG</span></div>
    <figcaption><div class="name">demo-catppuccin.svg</div><div class="meta">Catppuccin Mocha</div></figcaption>
  </figure>
  <figure class="card" data-format="png" data-src="../demo-catppuccin.png">
    <div class="thumb-wrap"><img src="../demo-catppuccin.png" alt="demo-catppuccin.png" loading="lazy"><span class="badge">PNG · 2×</span></div>
    <figcaption><div class="name">demo-catppuccin.png</div><div class="meta">Catppuccin Mocha — 2× retina</div></figcaption>
  </figure>
  <figure class="card" data-format="svg" data-src="../demo-solarized-dark.svg">
    <div class="thumb-wrap"><img src="../demo-solarized-dark.svg" alt="demo-solarized-dark.svg" loading="lazy"><span class="badge">SVG</span></div>
    <figcaption><div class="name">demo-solarized-dark.svg</div><div class="meta">Solarized Dark</div></figcaption>
  </figure>
  <figure class="card" data-format="png" data-src="../demo-solarized-dark.png">
    <div class="thumb-wrap"><img src="../demo-solarized-dark.png" alt="demo-solarized-dark.png" loading="lazy"><span class="badge">PNG · 2×</span></div>
    <figcaption><div class="name">demo-solarized-dark.png</div><div class="meta">Solarized Dark — 2× retina</div></figcaption>
  </figure>
</main>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-top">
    <button class="lb-btn" id="lb-close" aria-label="Close">✕</button>
    <div class="lb-caption" id="lb-caption"></div>
    <a class="lb-btn" id="lb-open" aria-label="Open original" title="Open original file" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">↗</a>
  </div>
  <div class="lb-stage" id="lb-stage">
    <img id="lb-img" alt="">
    <iframe id="lb-pdf" hidden></iframe>
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous">‹</button>
    <button class="lb-nav lb-next" id="lb-next" aria-label="Next">›</button>
  </div>
  <div class="lb-hint">← / → navigate · Esc close</div>
</div>

<script>
(function () {
  var grid = document.getElementById('grid');
  var cards = Array.prototype.slice.call(grid.querySelectorAll('.card'));
  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lb-img');
  var lbPdf = document.getElementById('lb-pdf');
  var lbCaption = document.getElementById('lb-caption');
  var lbOpen = document.getElementById('lb-open');
  var current = -1;

  function visible() { return cards.filter(function (c) { return !c.hidden; }); }

  function openCard(card) {
    var list = visible();
    current = list.indexOf(card);
    if (current < 0) return;
    show(list[current]);
    lightbox.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function show(card) {
    var src = card.getAttribute('data-src');
    var fmt = card.getAttribute('data-format');
    var name = card.querySelector('.name').textContent;
    var meta = card.querySelector('.meta').textContent;
    lbCaption.textContent = name + ' — ' + meta;
    lbOpen.href = src;
    if (fmt === 'pdf') {
      lbImg.hidden = true;
      lbPdf.hidden = false;
      lbPdf.src = src;
    } else {
      lbPdf.hidden = true;
      lbImg.hidden = false;
      lbImg.src = src;
      lbImg.alt = name;
    }
  }

  function step(delta) {
    var list = visible();
    if (!list.length) return;
    current = (current + delta + list.length) % list.length;
    show(list[current]);
  }

  function close() {
    lightbox.hidden = true;
    lbPdf.src = '';
    document.body.style.overflow = '';
  }

  cards.forEach(function (card) {
    card.addEventListener('click', function () { openCard(card); });
  });

  document.getElementById('lb-close').addEventListener('click', close);
  document.getElementById('lb-prev').addEventListener('click', function () { step(-1); });
  document.getElementById('lb-next').addEventListener('click', function () { step(1); });
  // Clicking the backdrop (not the image) closes the lightbox.
  document.getElementById('lb-stage').addEventListener('click', function (e) {
    if (e.target === this) close();
  });

  document.addEventListener('keydown', function (e) {
    if (lightbox.hidden) return;
    if (e.key === 'Escape') {
      close();
    } else if (e.key === 'ArrowLeft') {
      step(-1);
    } else if (e.key === 'ArrowRight') {
      step(1);
    }
  });

  // Format filters.
  document.getElementById('filters').addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
    chip.classList.add('active');
    var f = chip.getAttribute('data-filter');
    cards.forEach(function (card) { card.hidden = f !== 'all' && card.getAttribute('data-format') !== f; });
  });
})();
</script>
</body>
</html>
